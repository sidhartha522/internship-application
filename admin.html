<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Internship Applications</title>
  <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
  <div class="admin-container">
    <header class="admin-header">
      <h1>🎯 Internship Applications Dashboard</h1>
      <div class="header-actions">
        <button id="refreshBtn" class="btn-refresh">🔄 Refresh</button>
        <button id="exportBtn" class="btn-export">📥 Export CSV</button>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-number" id="totalApps">0</div>
        <div class="stat-label">Total Applications</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="todayApps">0</div>
        <div class="stat-label">Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="withResumes">0</div>
        <div class="stat-label">With Resume</div>
      </div>
    </div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="🔍 Search by name, email, position..." />
      <select id="positionFilter">
        <option value="">All Positions</option>
        <option value="Backend Intern (Python + Flask)">Backend Intern</option>
        <option value="Frontend Intern (React)">Frontend Intern</option>
        <option value="Full-Stack Intern (React + Python)">Full-Stack Intern</option>
      </select>
      <select id="skillFilter">
        <option value="">All Skills</option>
        <option value="1">Skill 1</option>
        <option value="2">Skill 2</option>
        <option value="3">Skill 3</option>
        <option value="4">Skill 4</option>
        <option value="5">Skill 5</option>
      </select>
    </div>

    <div id="loading" class="loading">Loading applications...</div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="applicationsGrid" class="applications-grid"></div>

    <!-- Modal for detailed view -->
    <div id="detailModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="admin-script.js"></script>
</body>
</html>
